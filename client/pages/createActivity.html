<!DOCTYPE html>

<html>
<head>
    <title>Create Activity</title>

    <link rel="stylesheet" href="../styles/createActivity.css">
    <link rel="icon" href="../images/icon.ico">
</head>
<body>
    <input type="button" value="Main Menu" id="back">
    <input type="button" value="Create Workout" id="createWorkout">

    <div id="activityList" name="activityList"></div>
