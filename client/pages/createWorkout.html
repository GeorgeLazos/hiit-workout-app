<!DOCTYPE html>

<html>
<head>
    <title>Create Workout</title>
    <script src="../scripts/createWorkout.js" defer></script>
    <link rel="stylesheet" href="../styles/createWorkout.css">
    <link rel="icon" href="../images/icon.ico">  
</head>
<body>
    <input type="button" value="Main Menu" id="back">
    <input type="button" value="Create Activity" id="createActivity">
    <hr>
    <div id="workoutForm">
        <input type="text" id="workoutTitle" name="workoutTitle" placeholder="Enter Workout title">
        <input type="text" id="workoutNote" name="workoutNote" placeholder="Enter Workout Notes">
    </div>
   
    <h3>New Workout:</h3>
    <div id="selectedActivityList" name="selectedActivityList"></div>

    <h3>Activities:<h3>
    <div id="activityList" name="activityList">

    </div> 

    <input type="button" value="Create Workout" id="workoutSubmit">
    <p id="error" style="color: red;"></p>
    <hr>
    <h3>Workouts</h3>
    <div id="allWorkoutList" class="workout"></div>
</body>
</html>
