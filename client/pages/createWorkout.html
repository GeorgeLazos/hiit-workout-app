<!DOCTYPE html>
<html>
<head>
    <title>Create Workout</title>
    <script src="../scripts/createWorkout.js" defer></script>  
</head>
<body>
    <input type="text" id="workoutTitle" name="workoutTitle" placeholder="Enter Workout title here">
    <input type="text" id="workoutNote" name="workoutNote" placeholder="Enter Workout Notes here">
    
    <input type="button" value="Create Workout" id="workoutSubmit">
    <input type="button" value="Create Activity" id="createActivity">
    <input type="button" value="Back to Menu" id="back">
    <p id="error" style="color: red;"></p>
    <label for="selectedActivityList'">New Workout:</label>
    <div id="selectedActivityList"></div> 
    <label for="activityList">All Activities:</label>
    <div id="activityList"></div> 
    <label for="allWorkoutList">All Workouts:</label>
    <div id="allWorkoutList" class="workout"></div> 
</body>
</html>
