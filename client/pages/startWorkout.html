<!DOCTYPE html>
<html>

<head>
    <title>Start Workout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Choose Workout</h1>
    <div class="workoutList">
        <label for="workoutSelect">Select Workout:</label>
        <select id="workoutSelect" onchange="">
            <option value="preset1">Preset Workout 1</option>
            <option value="preset2">Preset Workout 2</option>
        </select>
    </div>
    <div>
        <label for="difHigh">
            <input type="radio" id="difHigh" name="difLvl" value="DifHigh"> High
        </label>

        <label for="difMid">
            <input type="radio" id="difMid" name="difLvl" value="DifMedium"> Medium
        </label>

        <label for="difEasy">
            <input type="radio" id="difEasy" name="difLvl" value="DifEasy"> Easy
        </label>
    </div>
</body>
</html>
