<!DOCTYPE html>
<html>

<head>
    <title>Start Workout</title>
</head>

<body>
    <h1>Choose Workout</h1>
    <div>
        <label for="workoutList">Select Workout:</label>
        <select id="workoutList" onchange="">
            <option value="preset1">Preset Workout 1</option>
        </select>
        
        <label for="difHigh">High</label>
        <input type="radio" id="difHigh" class="difficulty" name="difficulty" value="DifHigh">

        <label for="difMid">Medium</label>
        <input type="radio" id="difMid" class="difficulty" name="difficulty" value="DifMedium" checked> 
        
        <label for="difEasy">Easy</label>
        <input type="radio" id="difEasy" class="difficulty" name="difficulty" value="DifEasy"> 
        <input type="button" value="Back" id="back" onclick="window.location.href = '../pages/index.html'">
    </div>
</body>
</html>
